name: Apply Kernel Patches

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch to apply patches to'
        required: true
        default: '14.0'
      patch_source_type:
        description: 'Patch source type'
        required: true
        type: choice
        options:
          - 'repo-commits'
          - 'raw-urls'
          - 'replace-files'
        default: 'repo-commits'
      source_repo:
        description: 'Source repository URL (for repo-commits mode)'
        required: false
      commit_hashes:
        description: 'Commit hashes to apply as patches (comma or space separated, for repo-commits mode)'
        required: false
      raw_patch_urls:
        description: 'Raw patch file URLs (comma or newline separated, for raw-urls mode)'
        required: false
      file_replacements:
        description: 'File replacements in format: path/to/file.c=https://raw.url (comma or newline separated, for replace-files mode)'
        required: false
      replacement_commit_message:
        description: 'Custom commit message for file replacements (optional)'
        required: false
        default: 'Update files from upstream'
      dry_run:
        description: 'Dry run (no actual changes)'
        required: true
        type: boolean
        default: true
      fuzz_factor:
        description: 'Patch fuzz factor (0-3, higher = more tolerant)'
        required: true
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
        default: '3'
      reject_strategy:
        description: 'What to do with rejected hunks'
        required: true
        type: choice
        options:
          - 'stop-on-reject'
          - 'continue-with-rejects'
          - 'skip-failed-patches'
        default: 'stop-on-reject'

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Checkout target branch
        run: |
          git checkout ${{ github.event.inputs.target_branch }}
      
      - name: Validate inputs
        run: |
          if [ "${{ github.event.inputs.patch_source_type }}" = "repo-commits" ]; then
            if [ -z "${{ github.event.inputs.source_repo }}" ] || [ -z "${{ github.event.inputs.commit_hashes }}" ]; then
              echo "::error::For repo-commits mode, both source_repo and commit_hashes are required"
              exit 1
            fi
          elif [ "${{ github.event.inputs.patch_source_type }}" = "raw-urls" ]; then
            if [ -z "${{ github.event.inputs.raw_patch_urls }}" ]; then
              echo "::error::For raw-urls mode, raw_patch_urls is required"
              exit 1
            fi
          elif [ "${{ github.event.inputs.patch_source_type }}" = "replace-files" ]; then
            if [ -z "${{ github.event.inputs.file_replacements }}" ]; then
              echo "::error::For replace-files mode, file_replacements is required"
              exit 1
            fi
          fi
      
      - name: Replace files from raw URLs
        if: github.event.inputs.patch_source_type == 'replace-files'
        id: replace_files
        run: |
          echo "=========================================="
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN MODE - File Replacement"
          else
            echo "FILE REPLACEMENT MODE"
          fi
          echo "=========================================="
          echo ""
          
          # Parse file replacements - support both comma and newline separation
          REPLACEMENTS="${{ github.event.inputs.file_replacements }}"
          # Replace commas with newlines, then clean up whitespace
          REPLACEMENTS=$(echo "$REPLACEMENTS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$')
          
          SUCCESS=0
          FAILED=0
          CHANGED_FILES=""
          FAILED_FILES=""
          TOTAL_ADDITIONS=0
          TOTAL_DELETIONS=0
          
          # Store current state for comparison
          mkdir -p /tmp/file_comparison
          
          echo "Parsing file replacements..."
          echo ""
          
          while IFS= read -r line; do
            # Skip empty lines and trim whitespace
            line=$(echo "$line" | xargs)
            [ -z "$line" ] && continue
            
            # Parse line: filepath=url
            if ! echo "$line" | grep -q '='; then
              echo "⚠ Skipping invalid line (no '=' found): $line"
              echo ""
              continue
            fi
            
            FILE_PATH=$(echo "$line" | cut -d'=' -f1 | xargs)
            RAW_URL=$(echo "$line" | cut -d'=' -f2- | xargs)
            
            # Validate we got both parts
            if [ -z "$FILE_PATH" ] || [ -z "$RAW_URL" ]; then
              echo "⚠ Skipping invalid line: $line"
              echo ""
              continue
            fi
            
            echo "----------------------------------------"
            echo "File: $FILE_PATH"
            echo "Source: $RAW_URL"
            echo ""
            
            # Create directory if it doesn't exist
            FILE_DIR=$(dirname "$FILE_PATH")
            mkdir -p "$FILE_DIR"
            
            # Check if file exists and backup for comparison
            FILE_EXISTS=false
            if [ -f "$FILE_PATH" ]; then
              FILE_EXISTS=true
              # Use full path hash for unique filenames
              FILE_HASH=$(echo "$FILE_PATH" | md5sum | cut -d' ' -f1)
              cp "$FILE_PATH" "/tmp/file_comparison/${FILE_HASH}.old"
              echo "Status: File exists, will be replaced"
            else
              FILE_HASH=$(echo "$FILE_PATH" | md5sum | cut -d' ' -f1)
              echo "Status: New file will be created"
            fi
            
            # Download the new content
            if curl -f -L -s "$RAW_URL" -o "/tmp/file_comparison/${FILE_HASH}.new"; then
              echo "✓ Downloaded successfully"
              
              if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
                # Dry run - just show what would change
                if [ "$FILE_EXISTS" = true ]; then
                  echo ""
                  echo "Changes that would be made:"
                  echo "-----------------------------------"
                  diff -u "/tmp/file_comparison/${FILE_HASH}.old" "/tmp/file_comparison/${FILE_HASH}.new" || true
                  echo "-----------------------------------"
                  
                  # Count changes
                  ADDS=$(diff "/tmp/file_comparison/${FILE_HASH}.old" "/tmp/file_comparison/${FILE_HASH}.new" 2>/dev/null | grep -c "^>" || echo "0")
                  DELS=$(diff "/tmp/file_comparison/${FILE_HASH}.old" "/tmp/file_comparison/${FILE_HASH}.new" 2>/dev/null | grep -c "^<" || echo "0")
                  echo "Lines added: $ADDS, Lines removed: $DELS"
                else
                  LINES=$(wc -l < "/tmp/file_comparison/${FILE_HASH}.new")
                  echo "New file would be created with $LINES lines"
                  ADDS=$LINES
                  DELS=0
                fi
              else
                # Actually replace the file
                cp "/tmp/file_comparison/${FILE_HASH}.new" "$FILE_PATH"
                
                if [ "$FILE_EXISTS" = true ]; then
                  echo ""
                  echo "File replaced. Changes made:"
                  echo "-----------------------------------"
                  diff -u "/tmp/file_comparison/${FILE_HASH}.old" "/tmp/file_comparison/${FILE_HASH}.new" || true
                  echo "-----------------------------------"
                  
                  # Count changes
                  ADDS=$(diff "/tmp/file_comparison/${FILE_HASH}.old" "/tmp/file_comparison/${FILE_HASH}.new" 2>/dev/null | grep -c "^>" || echo "0")
                  DELS=$(diff "/tmp/file_comparison/${FILE_HASH}.old" "/tmp/file_comparison/${FILE_HASH}.new" 2>/dev/null | grep -c "^<" || echo "0")
                  echo "Lines added: $ADDS, Lines removed: $DELS"
                else
                  LINES=$(wc -l < "$FILE_PATH")
                  echo "New file created with $LINES lines"
                  ADDS=$LINES
                  DELS=0
                fi
                
                TOTAL_ADDITIONS=$((TOTAL_ADDITIONS + ADDS))
                TOTAL_DELETIONS=$((TOTAL_DELETIONS + DELS))
              fi
              
              SUCCESS=$((SUCCESS + 1))
              CHANGED_FILES="$CHANGED_FILES$FILE_PATH "
            else
              echo "✗ Failed to download from: $RAW_URL"
              FAILED=$((FAILED + 1))
              FAILED_FILES="$FAILED_FILES$FILE_PATH "
            fi
            
            echo ""
          done <<< "$REPLACEMENTS"
          
          echo "=========================================="
          echo "File Replacement Summary:"
          echo "  Successfully processed: $SUCCESS"
          echo "  Failed: $FAILED"
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            echo "  Total lines added: $TOTAL_ADDITIONS"
            echo "  Total lines removed: $TOTAL_DELETIONS"
          fi
          echo "=========================================="
          
          echo "success_count=$SUCCESS" >> $GITHUB_OUTPUT
          echo "failed_count=$FAILED" >> $GITHUB_OUTPUT
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "failed_files=$FAILED_FILES" >> $GITHUB_OUTPUT
          echo "total_additions=$TOTAL_ADDITIONS" >> $GITHUB_OUTPUT
          echo "total_deletions=$TOTAL_DELETIONS" >> $GITHUB_OUTPUT
          
          if [ $FAILED -gt 0 ]; then
            echo "::warning::$FAILED files failed to download"
          fi
          
          if [ $SUCCESS -eq 0 ]; then
            echo "::error::No files processed successfully"
            exit 1
          fi
      
      - name: Commit file replacements
        if: github.event.inputs.patch_source_type == 'replace-files' && github.event.inputs.dry_run == 'false'
        run: |
          # Check if there are any changes
          if ! git diff --quiet; then
            echo "Committing changes..."
            
            # Build commit message
            COMMIT_MSG="${{ github.event.inputs.replacement_commit_message }}"
            
            # Add file list to commit message
            COMMIT_MSG="$COMMIT_MSG

          Files updated:
          "
            for file in ${{ steps.replace_files.outputs.changed_files }}; do
              COMMIT_MSG="$COMMIT_MSG- $file
          "
            done
            
            COMMIT_MSG="$COMMIT_MSG
          Summary: ${{ steps.replace_files.outputs.success_count }} file(s) updated
          Changes: +${{ steps.replace_files.outputs.total_additions }} -${{ steps.replace_files.outputs.total_deletions }} lines"
            
            git add -A
            git commit -m "$COMMIT_MSG"
            
            echo "✓ Changes committed successfully"
          else
            echo "No changes to commit"
          fi
      
      - name: Download patches from repo commits
        if: github.event.inputs.patch_source_type == 'repo-commits'
        id: download_patches_repo
        run: |
          # Parse comma or space separated commits
          COMMITS="${{ github.event.inputs.commit_hashes }}"
          COMMITS=$(echo "$COMMITS" | tr ',' ' ' | tr -s ' ')
          
          # Clean repo URL (remove .git suffix if present)
          REPO_URL="${{ github.event.inputs.source_repo }}"
          REPO_URL="${REPO_URL%.git}"
          
          echo "Source repository: $REPO_URL"
          echo "Commits to process: $COMMITS"
          echo ""
          
          mkdir -p /tmp/patches
          COUNTER=1
          SUCCESS=0
          FAILED=0
          
          for commit in $COMMITS; do
            echo "[$COUNTER] Downloading patch for commit: $commit"
            PATCH_URL="${REPO_URL}/commit/${commit}.patch"
            PATCH_FILE="/tmp/patches/${COUNTER}_${commit}.patch"
            
            if curl -f -L -s "$PATCH_URL" -o "$PATCH_FILE"; then
              echo "✓ Downloaded: $PATCH_URL"
              
              # Show patch info
              echo "Patch subject:"
              head -n 20 "$PATCH_FILE" | grep -E "^(Subject|From|Date):" || true
              
              SUCCESS=$((SUCCESS + 1))
            else
              echo "✗ Failed to download: $PATCH_URL"
              FAILED=$((FAILED + 1))
            fi
            
            echo ""
            COUNTER=$((COUNTER + 1))
          done
          
          echo "download_success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "download_failed=$FAILED" >> $GITHUB_OUTPUT
          echo "::notice::Downloaded $SUCCESS patches, $FAILED failed"
          
          if [ $SUCCESS -eq 0 ]; then
            echo "::error::No patches downloaded successfully"
            exit 1
          fi
      
      - name: Download patches from raw URLs
        if: github.event.inputs.patch_source_type == 'raw-urls'
        id: download_patches_raw
        run: |
          # Parse URLs (support both comma and newline separation)
          URLS="${{ github.event.inputs.raw_patch_urls }}"
          URLS=$(echo "$URLS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$')
          
          echo "Patch URLs to download:"
          echo "$URLS"
          echo ""
          
          mkdir -p /tmp/patches
          COUNTER=1
          SUCCESS=0
          FAILED=0
          
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            
            echo "[$COUNTER] Downloading patch from: $url"
            
            # Generate filename from URL or use counter
            FILENAME=$(basename "$url" .patch)
            FILENAME=$(echo "$FILENAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
            PATCH_FILE="/tmp/patches/${COUNTER}_${FILENAME}.patch"
            
            if curl -f -L -s "$url" -o "$PATCH_FILE"; then
              echo "✓ Downloaded successfully"
              
              # Show patch info
              echo "Patch details:"
              head -n 30 "$PATCH_FILE" | grep -E "^(Subject|From|Date|---)" || true
              
              SUCCESS=$((SUCCESS + 1))
            else
              echo "✗ Failed to download: $url"
              FAILED=$((FAILED + 1))
            fi
            
            echo ""
            COUNTER=$((COUNTER + 1))
          done <<< "$URLS"
          
          echo "download_success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "download_failed=$FAILED" >> $GITHUB_OUTPUT
          echo "::notice::Downloaded $SUCCESS patches, $FAILED failed"
          
          if [ $SUCCESS -eq 0 ]; then
            echo "::error::No patches downloaded successfully"
            exit 1
          fi
      
      - name: Dry run - Test patch application
        if: github.event.inputs.dry_run == 'true' && github.event.inputs.patch_source_type != 'replace-files'
        run: |
          echo "=========================================="
          echo "DRY RUN MODE - No changes will be committed"
          echo "=========================================="
          echo "Target branch: ${{ github.event.inputs.target_branch }}"
          echo "Patch source: ${{ github.event.inputs.patch_source_type }}"
          echo "Fuzz factor: ${{ github.event.inputs.fuzz_factor }}"
          
          if [ "${{ github.event.inputs.patch_source_type }}" = "repo-commits" ]; then
            echo "Patches to apply: ${{ steps.download_patches_repo.outputs.download_success }}"
          else
            echo "Patches to apply: ${{ steps.download_patches_raw.outputs.download_success }}"
          fi
          
          echo "=========================================="
          echo ""
          
          SUCCESS=0
          PARTIAL=0
          FAILED=0
          
          # Create temp directory for reject files
          mkdir -p /tmp/rejects
          
          for patch_file in /tmp/patches/*.patch; do
            [ -f "$patch_file" ] || continue
            
            PATCH_NAME=$(basename "$patch_file")
            echo "----------------------------------------"
            echo "Testing: $PATCH_NAME"
            echo ""
            
            # Pre-create directories for new files in the patch (for dry-run testing)
            echo "Checking for new files in patch..."
            NEW_FILES=$(grep -E "^\+\+\+ b/" "$patch_file" | sed 's|^+++ b/||' || true)
            for new_file in $NEW_FILES; do
              if [ ! -f "$new_file" ]; then
                new_dir=$(dirname "$new_file")
                if [ ! -d "$new_dir" ]; then
                  echo "  Would create directory: $new_dir"
                  mkdir -p "$new_dir"
                fi
                echo "  Would create new file: $new_file"
              fi
            done
            echo ""
            
            REJECT_FILE="/tmp/rejects/${PATCH_NAME}.rej"
            
            # Use -N flag to handle new files
            if patch --dry-run -p1 -N -F ${{ github.event.inputs.fuzz_factor }} -l --no-backup-if-mismatch --reject-file="$REJECT_FILE" < "$patch_file" 2>&1 | tee /tmp/patch_output.txt; then
              echo "✓ Would apply cleanly"
              
              # Show what would change
              echo ""
              if grep -q "creating" /tmp/patch_output.txt; then
                echo "New files that would be created:"
                grep "creating" /tmp/patch_output.txt | sed 's/^/  /'
              fi
              if grep -q "patching file" /tmp/patch_output.txt; then
                echo "Files that would be modified:"
                grep "patching file" /tmp/patch_output.txt | sed 's/patching file /  - /'
              fi
              
              SUCCESS=$((SUCCESS + 1))
            else
              # Check if reject file was created
              if [ -f "$REJECT_FILE" ]; then
                echo "⚠ Would apply partially (some hunks would fail)"
                echo ""
                echo "Rejected hunks for $PATCH_NAME:"
                echo "-----------------------------------"
                cat "$REJECT_FILE"
                echo "-----------------------------------"
                
                PARTIAL=$((PARTIAL + 1))
              else
                echo "✗ Would fail completely"
                FAILED=$((FAILED + 1))
              fi
              
              # Show failed hunks from output
              if grep -q "Hunk.*FAILED" /tmp/patch_output.txt; then
                echo ""
                echo "Failed hunks summary:"
                grep -E "Hunk.*FAILED" /tmp/patch_output.txt | sed 's/^/  /'
              fi
            fi
            
            echo ""
          done
          
          echo "=========================================="
          echo "Dry Run Summary:"
          echo "  Clean patches: $SUCCESS"
          echo "  Partial patches: $PARTIAL"
          echo "  Failed patches: $FAILED"
          echo "=========================================="
          
          if [ $PARTIAL -gt 0 ]; then
            echo "::warning::$PARTIAL patches would apply partially"
          fi
          
          if [ $FAILED -gt 0 ]; then
            echo "::warning::$FAILED patches would fail completely"
          fi
      
      - name: Apply patches
        if: github.event.inputs.dry_run == 'false' && github.event.inputs.patch_source_type != 'replace-files'
        id: apply_patches
        run: |
          SUCCESS=0
          PARTIAL=0
          FAILED=0
          FAILED_PATCHES=""
          PARTIAL_PATCHES=""
          
          # Create temp directory for reject files (not in source tree)
          mkdir -p /tmp/rejects
          
          for patch_file in /tmp/patches/*.patch; do
            [ -f "$patch_file" ] || continue
            
            PATCH_NAME=$(basename "$patch_file")
            echo "=========================================="
            echo "Applying: $PATCH_NAME"
            echo ""
            
            # Extract commit metadata from patch file
            SUBJECT=$(grep -m1 "^Subject:" "$patch_file" | sed 's/^Subject: //' | sed 's/^\[PATCH[^]]*\] *//')
            AUTHOR=$(grep -m1 "^From:" "$patch_file" | sed 's/^From: //')
            DATE=$(grep -m1 "^Date:" "$patch_file" | sed 's/^Date: //')
            
            # If no proper headers, try to extract from git format-patch style
            if [ -z "$SUBJECT" ]; then
              SUBJECT=$(head -n 50 "$patch_file" | grep -v "^From " | grep -v "^---" | grep -v "^diff" | grep -v "^index" | head -n 1)
            fi
            
            # Fallback to filename if still empty
            if [ -z "$SUBJECT" ]; then
              SUBJECT="$PATCH_NAME"
            fi
            
            echo "Subject: $SUBJECT"
            [ -n "$AUTHOR" ] && echo "Author: $AUTHOR"
            [ -n "$DATE" ] && echo "Date: $DATE"
            echo ""
            
            # Pre-create directories for new files in the patch
            echo "Checking for new files in patch..."
            NEW_FILES=$(grep -E "^\+\+\+ b/" "$patch_file" | sed 's|^+++ b/||' || true)
            for new_file in $NEW_FILES; do
              if [ ! -f "$new_file" ]; then
                new_dir=$(dirname "$new_file")
                if [ ! -d "$new_dir" ]; then
                  echo "  Creating directory: $new_dir"
                  mkdir -p "$new_dir"
                fi
              fi
            done
            echo ""
            
            REJECT_FILE="/tmp/rejects/${PATCH_NAME}.rej"
            
            # Apply patch with options to handle new files:
            # -p1: Strip one level of path
            # -F: Fuzz factor (higher = more tolerant)
            # -l: Ignore whitespace changes
            # --ignore-whitespace: Ignore whitespace differences
            # --no-backup-if-mismatch: Don't create .orig files
            # --reject-file: Save rejects to temp location
            # -N: Treat absent files as empty (allows creating new files)
            if patch -p1 -N -F ${{ github.event.inputs.fuzz_factor }} -l --ignore-whitespace --no-backup-if-mismatch --reject-file="$REJECT_FILE" < "$patch_file" 2>&1 | tee /tmp/patch_output.txt; then
              echo "✓ Applied successfully"
              SUCCESS=$((SUCCESS + 1))
              
              # Show which files were created vs modified
              echo ""
              if grep -q "creating" /tmp/patch_output.txt; then
                echo "New files created:"
                grep "creating" /tmp/patch_output.txt | sed 's/^/  /'
              fi
              if grep -q "patching file" /tmp/patch_output.txt; then
                echo "Files modified:"
                grep "patching file" /tmp/patch_output.txt | sed 's/^/  /'
              fi
              echo ""
              
              # Create detailed commit message
              COMMIT_MSG="$SUBJECT"
              
              if [ -n "$AUTHOR" ] || [ -n "$DATE" ]; then
                COMMIT_MSG="$COMMIT_MSG

          "
                [ -n "$AUTHOR" ] && COMMIT_MSG="${COMMIT_MSG}Original-author: $AUTHOR
          "
                [ -n "$DATE" ] && COMMIT_MSG="${COMMIT_MSG}Original-date: $DATE
          "
              fi
              
              # Add source info
              if [ "${{ github.event.inputs.patch_source_type }}" = "repo-commits" ]; then
                COMMIT_HASH=$(echo "$PATCH_NAME" | grep -oE '[a-f0-9]{7,}')
                COMMIT_MSG="${COMMIT_MSG}
          Source: ${{ github.event.inputs.source_repo }}/commit/$COMMIT_HASH"
              else
                COMMIT_MSG="${COMMIT_MSG}
          Source: Raw patch file"
              fi
              
              # Commit the changes with detailed message
              git add -A
              git commit -m "$COMMIT_MSG" || true
              
            else
              # Check if reject file was created
              if [ -f "$REJECT_FILE" ]; then
                echo "⚠ Applied partially (some hunks failed)"
                echo ""
                echo "Rejected hunks:"
                echo "-----------------------------------"
                cat "$REJECT_FILE"
                echo "-----------------------------------"
                
                PARTIAL=$((PARTIAL + 1))
                PARTIAL_PATCHES="$PARTIAL_PATCHES$PATCH_NAME "
                
                case "${{ github.event.inputs.reject_strategy }}" in
                  "continue-with-rejects")
                    echo "→ Continuing (reject file saved to /tmp/rejects/)"
                    
                    # Create commit message for partial patch
                    COMMIT_MSG="[PARTIAL] $SUBJECT

          ⚠️ This patch was partially applied. Some hunks failed.
          Check workflow logs for rejected hunks.
          "
                    [ -n "$AUTHOR" ] && COMMIT_MSG="${COMMIT_MSG}
          Original-author: $AUTHOR"
                    
                    git add -A
                    git commit -m "$COMMIT_MSG" || true
                    ;;
                  "skip-failed-patches")
                    echo "⊘ Skipping this patch"
                    git reset --hard HEAD
                    ;;
                  *)
                    echo "::error::Patch failed, stopping"
                    exit 1
                    ;;
                esac
              else
                echo "✗ Failed completely"
                FAILED=$((FAILED + 1))
                FAILED_PATCHES="$FAILED_PATCHES$PATCH_NAME "
                
                if [ "${{ github.event.inputs.reject_strategy }}" = "stop-on-reject" ]; then
                  echo "::error::Patch failed, stopping"
                  exit 1
                else
                  echo "⊘ Skipping this patch"
                fi
              fi
            fi
            
            echo ""
          done
          
          echo "success_count=$SUCCESS" >> $GITHUB_OUTPUT
          echo "partial_count=$PARTIAL" >> $GITHUB_OUTPUT
          echo "failed_count=$FAILED" >> $GITHUB_OUTPUT
          echo "failed_patches=$FAILED_PATCHES" >> $GITHUB_OUTPUT
          echo "partial_patches=$PARTIAL_PATCHES" >> $GITHUB_OUTPUT
      
      - name: Show reject files summary
        if: github.event.inputs.dry_run == 'false' && github.event.inputs.patch_source_type != 'replace-files'
        run: |
          echo "Checking for reject files in /tmp/rejects..."
          if ls /tmp/rejects/*.rej 1> /dev/null 2>&1; then
            echo "::warning::Reject files found (saved outside source tree):"
            ls -lh /tmp/rejects/*.rej
            
            echo ""
            echo "All reject files content:"
            for rej_file in /tmp/rejects/*.rej; do
              echo "========================================"
              echo "File: $(basename $rej_file)"
              echo "========================================"
              cat "$rej_file"
              echo ""
            done
          else
            echo "✓ No reject files found - all patches applied cleanly"
          fi
          
          # Verify no .rej or .orig files in source tree
          echo ""
          echo "Verifying source tree is clean..."
          if find . -name "*.rej" -o -name "*.orig" | grep -q .; then
            echo "::error::Found .rej or .orig files in source tree (this shouldn't happen):"
            find . -name "*.rej" -o -name "*.orig"
            exit 1
          else
            echo "✓ Source tree is clean (no .rej or .orig files)"
          fi
      
      - name: Push changes
        if: github.event.inputs.dry_run == 'false'
        run: |
          # Check which mode was used and get appropriate success count
          if [ "${{ github.event.inputs.patch_source_type }}" = "replace-files" ]; then
            SUCCESS_COUNT="${{ steps.replace_files.outputs.success_count }}"
          else
            SUCCESS_COUNT="${{ steps.apply_patches.outputs.success_count }}"
          fi
          
          if [ "$SUCCESS_COUNT" != "0" ]; then
            if git diff --quiet origin/${{ github.event.inputs.target_branch }}; then
              echo "::notice::No changes to push"
            else
              git push origin ${{ github.event.inputs.target_branch }}
              echo "::notice::Successfully pushed changes"
            fi
          else
            echo "::notice::No successful operations, nothing to push"
          fi
      
      - name: Final summary
        if: github.event.inputs.dry_run == 'false'
        run: |
          echo "=========================================="
          if [ "${{ github.event.inputs.patch_source_type }}" = "replace-files" ]; then
            echo "File Replacement Complete!"
            echo "=========================================="
            echo "Successfully processed: ${{ steps.replace_files.outputs.success_count }}"
            echo "Failed: ${{ steps.replace_files.outputs.failed_count }}"
            echo "Total changes: +${{ steps.replace_files.outputs.total_additions }} -${{ steps.replace_files.outputs.total_deletions }} lines"
          else
            echo "Patch Application Complete!"
            echo "=========================================="
            echo "Successfully applied: ${{ steps.apply_patches.outputs.success_count }}"
            echo "Partially applied: ${{ steps.apply_patches.outputs.partial_count }}"
            echo "Failed: ${{ steps.apply_patches.outputs.failed_count }}"
            
            if [ "${{ steps.apply_patches.outputs.partial_count }}" != "0" ]; then
              echo ""
              echo "Partially applied patches:"
              echo "${{ steps.apply_patches.outputs.partial_patches }}" | tr ' ' '\n'
            fi
            
            if [ "${{ steps.apply_patches.outputs.failed_count }}" != "0" ]; then
              echo ""
              echo "Failed patches:"
              echo "${{ steps.apply_patches.outputs.failed_patches }}" | tr ' ' '\n'
            fi
          fi
          echo "=========================================="
      
      - name: Create summary issue
        if: github.event.inputs.dry_run == 'false' && github.event.inputs.patch_source_type != 'replace-files' && (steps.apply_patches.outputs.partial_count != '0' || steps.apply_patches.outputs.failed_count != '0')
        uses: actions/github-script@v7
        with:
          script: |
            const patchSourceType = '${{ github.event.inputs.patch_source_type }}';
            const sourceInfo = patchSourceType === 'repo-commits' 
              ? '**Source:** ${{ github.event.inputs.source_repo }}'
              : '**Source:** Raw patch URLs';
            
            const partialCount = '${{ steps.apply_patches.outputs.partial_count }}';
            const failedCount = '${{ steps.apply_patches.outputs.failed_count }}';
            
            let body = `## Patch Application Summary
            
            ${sourceInfo}
            **Target branch:** ${{ github.event.inputs.target_branch }}
            **Fuzz factor:** ${{ github.event.inputs.fuzz_factor }}
            **Reject strategy:** ${{ github.event.inputs.reject_strategy }}
            
            ### Results
            - ✅ Successfully applied: ${{ steps.apply_patches.outputs.success_count }}
            - ⚠️ Partially applied: ${partialCount}
            - ❌ Failed: ${failedCount}
            `;
            
            if (partialCount !== '0') {
              body += `\n### Partially Applied Patches\n\`\`\`\n${{ steps.apply_patches.outputs.partial_patches }}\n\`\`\`\n`;
            }
            
            if (failedCount !== '0') {
              body += `\n### Failed Patches\n\`\`\`\n${{ steps.apply_patches.outputs.failed_patches }}\n\`\`\`\n`;
            }
            
            body += `\nReject files are saved in workflow logs under /tmp/rejects/ for manual review.\nThe source tree remains clean with no .rej or .orig files.`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Patch Application Summary: ' + new Date().toISOString().split('T')[0],
              body: body,
              labels: ['patch', 'kernel-update']
            });
