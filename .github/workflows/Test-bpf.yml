name: Merge Phoenix Kernel Branch

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      target_branch:
        description: 'Target branch to merge into'
        required: true
        default: 'Test-uv'
      dry_run:
        description: 'Dry run (no actual merge/push)'
        required: true
        type: boolean
        default: true
      cutoff_date:
        description: 'Only merge commits after this date (YYYY-MM-DD)'
        required: true
        default: '2024-12-28'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight (optional)

jobs:
  merge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add Phoenix Kernel remote
        run: |
          git remote add phoenix https://github.com/PhoenixKernel/linux.git
          git fetch phoenix
      
      - name: Checkout target branch
        run: |
          git checkout ${{ github.event.inputs.target_branch || 'main' }}
      
      - name: Find commits since cutoff date
        id: find_commits
        run: |
          echo "Finding commits from b24d1ae9ccbf since ${{ github.event.inputs.cutoff_date || '2024-12-28' }}..."
          
          # Get all commits from the Phoenix branch since the cutoff date
          COMMITS=$(git log --since="${{ github.event.inputs.cutoff_date || '2024-12-28' }} 00:00:00" \
                    --until="2024-12-29 00:00:00" \
                    --reverse --format="%H" \
                    b24d1ae9ccbf3ebe6f4baa50d2d48c03be02bc17)
          
          if [ -z "$COMMITS" ]; then
            echo "::error::No commits found on December 28, 2024"
            exit 1
          fi
          
          echo "Commits to merge:"
          echo "$COMMITS"
          
          # Get the last commit from Dec 28
          LAST_COMMIT=$(echo "$COMMITS" | tail -n 1)
          echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
          echo "::notice::Will merge up to commit: $LAST_COMMIT"
      
      - name: Dry run - Show what will be merged
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::DRY RUN MODE - No changes will be committed or pushed"
          echo "=========================================="
          echo "Target branch: ${{ github.event.inputs.target_branch || 'main' }}"
          echo "Source commit: ${{ steps.find_commits.outputs.last_commit }}"
          echo "Cutoff date: ${{ github.event.inputs.cutoff_date || '2024-12-28' }}"
          echo "=========================================="
          echo ""
          echo "Commits from December 28, 2024 to be merged:"
          git log --since="${{ github.event.inputs.cutoff_date || '2024-12-28' }} 00:00:00" \
                  --until="2024-12-29 00:00:00" \
                  --oneline --graph \
                  b24d1ae9ccbf3ebe6f4baa50d2d48c03be02bc17
          echo ""
          echo "Files that will be changed:"
          git diff --stat HEAD...${{ steps.find_commits.outputs.last_commit }}
          echo ""
          echo "Attempting test merge (will be aborted)..."
          git merge --no-commit --no-ff ${{ steps.find_commits.outputs.last_commit }} || true
      
      - name: Check for potential conflicts (dry run)
        if: github.event.inputs.dry_run == 'true'
        id: dry_check_conflicts
        run: |
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::warning::Merge would have conflicts!"
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::No conflicts detected - merge would succeed!"
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi
          git merge --abort || true
      
      - name: Dry run summary
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::Dry run complete. Set 'dry_run' to 'false' to perform actual merge."
      
      - name: Merge Phoenix Kernel commit
        if: github.event.inputs.dry_run == 'false'
        run: |
          git merge ${{ steps.find_commits.outputs.last_commit }} --no-ff -m "Merge Phoenix Kernel changes from Dec 28, 2024 (up to ${{ steps.find_commits.outputs.last_commit }})"
        continue-on-error: true
      
      - name: Check for merge conflicts
        if: github.event.inputs.dry_run == 'false'
        id: check_conflicts
        run: |
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "::warning::Merge conflicts detected!"
            git diff --name-only --diff-filter=U
            exit 1
          else
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Push changes
        if: github.event.inputs.dry_run == 'false' && steps.check_conflicts.outputs.has_conflicts == 'false'
        run: |
          git push origin ${{ github.event.inputs.target_branch || 'main' }}
      
      - name: Create issue on conflict
        if: github.event.inputs.dry_run == 'false' && failure() && steps.check_conflicts.outputs.has_conflicts == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Merge Conflict: Phoenix Kernel Integration',
              body: 'Automatic merge from Phoenix Kernel commit b24d1ae9ccbf failed due to conflicts. Manual resolution required.\n\nConflicting files:\n```\n' + process.env.CONFLICTS + '\n```',
              labels: ['merge-conflict', 'needs-attention']
            })
        env:
          CONFLICTS: ${{ steps.check_conflicts.outputs.conflicts }}
